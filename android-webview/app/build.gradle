plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "io.github.ichbinsakib.twa"

    defaultConfig {
        applicationId "io.github.ichbinsakib.twa"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 7
        versionName "7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // For periodic background checks (new signal / win / loss notifications) that keep
    // running even when the app isn't open -- WorkManager is the standard, battery-friendly
    // way to do this reliably across Android versions instead of a raw background thread.
    implementation 'androidx.work:work-runtime:2.9.1'
    // NotificationCompat/ActivityCompat -- consistent notification building and permission
    // requests back to minSdk 21 instead of branching on Build.VERSION for the framework APIs.
    implementation 'androidx.core:core:1.13.1'
}
