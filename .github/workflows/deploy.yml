name: Update Teka Dashboard

on:
  schedule:
    # The job takes ~4-5 min end to end (CoinGecko rate-limit retries + the 15m/1h intraday
    # fetches), so 10-minute spacing gives real margin. Explicit comma-separated minutes
    # instead of range/step syntax (e.g. "3-59/10") -- the latter produced zero triggers for
    # nearly an hour in practice despite validating fine in the workflow YAML view, so it's
    # not being trusted here even though it *should* be equivalent.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python dashboard.py

      - name: Persist data/ back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/state.json is a fully-regenerated snapshot every run, not an incrementally
          # diffable file -- a normal rebase/merge on a concurrent push will hit line-level
          # conflicts almost every time (every field changes each run). Instead of merging
          # histories, just re-base our freshly generated output on top of whatever is
          # latest on origin: `reset --soft` moves the branch pointer without touching the
          # working tree, so our just-written files simply become "the new commit" cleanly.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes to persist."
              exit 0
            fi
            git commit -m "Update dashboard data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race with a concurrent run, retrying ($i/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
