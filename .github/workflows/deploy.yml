name: Update Teka Dashboard

on:
  schedule:
    # The job itself now takes ~4-5 min end to end (CoinGecko rate-limit retries + the
    # 15m/1h intraday fetches), which left no headroom in a 5-minute interval -- runs were
    # colliding with the still-running previous one and getting skipped. 10 minutes, offset
    # off the round marks (GitHub's shared scheduler queues everyone's :00/:05/:10 crons
    # hard), gives real margin.
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        run: python dashboard.py

      - name: Persist data/ back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update dashboard data"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
