name: Update Kairo Dashboard

on:
  schedule:
    # The job takes ~4-5 min end to end (CoinGecko rate-limit retries + the 15m/1h intraday
    # fetches), so 10-minute spacing gives real margin. Explicit comma-separated minutes
    # instead of range/step syntax (e.g. "3-59/10") -- the latter produced zero triggers for
    # nearly an hour in practice despite validating fine in the workflow YAML view, so it's
    # not being trusted here even though it *should* be equivalent.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write      # pushes the `data` branch (engine state); nothing else is written back
  actions: write       # lets the `next` job queue the following run (see below)

# A newer run replaces one that is still queued/running. With false (GitHub's Pages template default),
# a single run that never gets a runner blocked every later run behind it for 29 hours and the
# dashboard silently stopped updating -- twice. A run takes ~3.5 min and the cron fires every 5,
# so healthy runs almost never overlap; when they do, the newer one simply redoes the work.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # All state lives in plain files on the `data` branch (a single commit, force-pushed each run so history never grows).
      # There is no database: nothing to pause, expire or close. Settings you edit by hand are config/*.json on main.
      - name: Restore data
        env:
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: |
          test -n "$STORE_KEY" || { echo "::error::Secret STORE_KEY is not set"; exit 1; }
          if git fetch --depth=1 origin data; then
            if git cat-file -e FETCH_HEAD:store.enc 2>/dev/null; then
              git show FETCH_HEAD:store.enc > /tmp/store.enc
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STORE_KEY -in /tmp/store.enc | tar xz
              echo "Restored store/ from the encrypted data bundle"
            else
              git checkout FETCH_HEAD -- store
              echo "Restored store/ from the old plain data branch (one-time migration)"
            fi
          else
            echo "No data branch yet -- starting with an empty store/"
          fi

      # The scalping engine runs FIRST and on its own step: GitHub starts a workflow's own schedule only every couple of hours,
      # but this workflow fires every ~5 minutes, so it is the reliable trigger. continue-on-error keeps a scalping problem from
      # ever failing the dashboard build (and the reverse). Overlapping runs with scalping.yml are safe: signal and alert ids are
      # deterministic and outcomes are replayed from candle history.
      - name: Scalping engine
        continue-on-error: true
        timeout-minutes: 4
        run: python scalping_job.py

      - name: Generate dashboard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # No Supabase secrets are passed any more: dashboard.py falls back to the file store (store/, config/).
        run: python dashboard.py

      # The repo is public, so the engine state is encrypted before it goes on the `data` branch: anyone can see the
      # file, nobody can read it without STORE_KEY. The branch is still a single force-pushed commit.
      - name: Save data (encrypted)
        env:
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: |
          tar cz store | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STORE_KEY -out /tmp/store.enc
          git config user.name "kairo-bot"
          git config user.email "kairo-bot@users.noreply.github.com"
          git checkout -q --orphan data-new
          git rm -rfq --cached .
          cp /tmp/store.enc store.enc
          git add -f store.enc
          git commit -qm "Kairo data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force origin data-new:data

      # The site goes to Cloudflare Pages, which sits behind Cloudflare Access (only your email can open it).
      # It is deployed from this same job on purpose: a workflow artifact on a public repo can be downloaded by others.
      - name: Publish site (private)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          proj="${{ vars.CF_PAGES_PROJECT || 'kairo-dashboard' }}"
          npx --yes wrangler@3 pages project create "$proj" --production-branch=main >/dev/null 2>&1 || true   # first run only; harmless if it exists
          npx --yes wrangler@3 pages deploy site --project-name="$proj" --branch=main --commit-dirty=true

  # GitHub's `schedule` trigger is best-effort and routinely skips or delays runs by an hour or more, which left the
  # dashboard stale and paused the scalping engine. A workflow_dispatch fired with the workflow's own GITHUB_TOKEN IS
  # allowed to start a new run (unlike push/schedule events), so each run queues its successor a few minutes after it
  # finishes. The cron above stays as a restart if the chain ever breaks (e.g. a cancelled run); the concurrency group
  # keeps a cron run and a chained run from doing the work twice, and the watchdog cancels anything stuck.
  next:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Queue the next run in ~4 minutes
        run: |
          sleep 240
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
