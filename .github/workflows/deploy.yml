name: Update Kairo Dashboard

on:
  schedule:
    # The job takes ~4-5 min end to end (CoinGecko rate-limit retries + the 15m/1h intraday
    # fetches), so 10-minute spacing gives real margin. Explicit comma-separated minutes
    # instead of range/step syntax (e.g. "3-59/10") -- the latter produced zero triggers for
    # nearly an hour in practice despite validating fine in the workflow YAML view, so it's
    # not being trusted here even though it *should* be equivalent.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write      # pushes the `data` branch (engine state); nothing else is written back
  pages: write
  id-token: write

# A newer run replaces one that is still queued/running. With false (GitHub's Pages template default),
# a single run that never gets a runner blocked every later run behind it for 29 hours and the
# dashboard silently stopped updating -- twice. A run takes ~3.5 min and the cron fires every 5,
# so healthy runs almost never overlap; when they do, the newer one simply redoes the work.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # All state lives in plain files on the `data` branch (a single commit, force-pushed each run so history never grows).
      # There is no database: nothing to pause, expire or close. Settings you edit by hand are config/*.json on main.
      - name: Restore data
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- store
            echo "Restored store/ from the data branch"
          else
            echo "No data branch yet -- starting with an empty store/"
          fi

      # The scalping engine runs FIRST and on its own step: GitHub starts a workflow's own schedule only every couple of hours,
      # but this workflow fires every ~5 minutes, so it is the reliable trigger. continue-on-error keeps a scalping problem from
      # ever failing the dashboard build (and the reverse). Overlapping runs with scalping.yml are safe: signal and alert ids are
      # deterministic and outcomes are replayed from candle history.
      - name: Scalping engine
        continue-on-error: true
        timeout-minutes: 4
        run: python scalping_job.py

      - name: Generate dashboard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # No Supabase secrets are passed any more: dashboard.py falls back to the file store (store/, config/).
        run: python dashboard.py

      - name: Save data
        run: |
          git config user.name "kairo-bot"
          git config user.email "kairo-bot@users.noreply.github.com"
          git checkout -q --orphan data-new
          git rm -rfq --cached .
          git add -f store
          git commit -qm "Kairo data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force origin data-new:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
