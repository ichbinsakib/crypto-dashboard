name: Update Kairo Dashboard

on:
  schedule:
    # The job takes ~4-5 min end to end (CoinGecko rate-limit retries + the 15m/1h intraday
    # fetches), so 10-minute spacing gives real margin. Explicit comma-separated minutes
    # instead of range/step syntax (e.g. "3-59/10") -- the latter produced zero triggers for
    # nearly an hour in practice despite validating fine in the workflow YAML view, so it's
    # not being trusted here even though it *should* be equivalent.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KAIRO_SUPABASE_URL: ${{ secrets.KAIRO_SUPABASE_URL }}
          KAIRO_SUPABASE_ANON_KEY: ${{ secrets.KAIRO_SUPABASE_ANON_KEY }}
          KAIRO_PUBLISHER_EMAIL: ${{ secrets.KAIRO_PUBLISHER_EMAIL }}
          KAIRO_PUBLISHER_PASSWORD: ${{ secrets.KAIRO_PUBLISHER_PASSWORD }}
        # State and dashboard content now live in Supabase behind row-level security, so nothing
        # readable is committed back to this (public) repo or published to Pages -- the published
        # site is only the login shell. dashboard.py refuses to run here without the credentials.
        run: python dashboard.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
